name: llama-cpp-sdk
adopt-info: llama-cpp
summary: LLM inference in C/C++ with llama.cpp
description: |
  llama.cpp provides tooling for large language model inference: the
  `llama-server` OpenAI-compatible HTTP server, `llama-cli`, `llama-bench`,
  and related utilities. This is the `latest` (CPU) channel; GPU-accelerated
  builds are available on the `cuda`, `rocm`, and `vulkan` channels. Downloaded
  models and server configuration are persisted across workshop updates, and an
  opt-in `llama-server` service is exposed on port 8080.
license: MIT
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@24.04:arm64:

plugs:
  models:
    interface: mount
    workshop-target: /home/workshop/.cache/llama.cpp
  config:
    interface: mount
    workshop-target: /home/workshop/.config/llama-cpp

slots:
  llama-server:
    interface: tunnel
    endpoint: 8080

parts:
  llama-cpp:
    plugin: dump
    source: .
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      ARCH="$CRAFT_ARCH_BUILD_FOR"
      case "$ARCH" in
        amd64) ASSET="llama-${VERSION}-bin-ubuntu-x64.tar.gz" ;;
        arm64) ASSET="llama-${VERSION}-bin-ubuntu-arm64.tar.gz" ;;
        *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac
      curl -fLO "https://github.com/ggml-org/llama.cpp/releases/download/${VERSION}/${ASSET}"
      mkdir -p "$CRAFT_PART_SRC/opt/llama.cpp"
      tar -xzf "$ASSET" --strip-components=1 -C "$CRAFT_PART_SRC/opt/llama.cpp"
      rm "$ASSET"
  services:
    plugin: dump
    source: services
    source-type: local
