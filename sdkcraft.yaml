name: llama-cpp-sdk
adopt-info: llama-cpp
summary: LLM inference in C/C++ with llama.cpp (AMD ROCm)
description: |
  llama.cpp provides tooling for large language model inference: the
  `llama-server` OpenAI-compatible HTTP server, `llama-cli`, `llama-bench`,
  and related utilities. This is the `rocm` channel, built with the AMD ROCm
  (HIP) backend. The ROCm runtime, rocBLAS, and hipBLASLt libraries are
  bundled, so no additional SDK is required; access to the GPU is granted via
  the `gpu` interface. Downloaded models and server configuration are persisted
  across workshop updates, and an opt-in `llama-server` service is exposed on
  port 8080.
license: MIT
platforms:
  ubuntu@24.04:amd64:

plugs:
  gpu:
    interface: gpu
  models:
    interface: mount
    workshop-target: /home/workshop/.cache/llama.cpp
  config:
    interface: mount
    workshop-target: /home/workshop/.config/llama-cpp

slots:
  llama-server:
    interface: tunnel
    endpoint: 8080

parts:
  llama-cpp:
    plugin: dump
    source: .
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      ASSET="llamacpp-amd64+rocm.tar.gz"
      curl -fLO "https://github.com/canonical/llama.cpp-builds/releases/download/${VERSION}/${ASSET}"
      mkdir -p "$CRAFT_PART_SRC/opt/llama.cpp"
      tar -xzf "$ASSET" -C "$CRAFT_PART_SRC/opt/llama.cpp"
      rm "$ASSET"
  services:
    plugin: dump
    source: services
    source-type: local
