name: Build and Upload SDK

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  amd64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      runs-on: '["ubuntu-24.04"]'
      platforms: '["ubuntu@22.04:amd64","ubuntu@24.04:amd64"]'
      platform-flag: "--platform"
      risk: "stable"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
  arm64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      runs-on: '["ubuntu-24.04-arm"]'
      platforms: '["ubuntu@22.04:arm64","ubuntu@24.04:arm64"]'
      platform-flag: "--platform"
      risk: "stable"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
